[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "KitchenCore"
version = "0.1.0"
description = "A suite of applications for restaurant operations."
requires-python = ">=3.13"
dependencies = [
    "SQLAlchemy>=2.0",
    "PySide6>=6.11",
    "python-dotenv>=1.2",
    "alembic>=1.13",
    "fpdf2>=2.8.9",
    "rich>=15.0.0",
    "InquirerPy>=0.3.4",
    "rapidfuzz>=3.14.6"
]

[project.scripts]
kitchen-ledger = "kitchen_ledger.app.main:main"

[pyproject.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]